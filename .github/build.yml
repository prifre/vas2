name: Build macOS and Android Releases

on:
  push:
    branches: [ "master", "main" ]

jobs:
  # JOBB 1: Bygg för macOS
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS Release
        run: |
          fyne package -os darwin -icon icon.png

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vas-macOS
          path: '*.app' # eller den packade binären/zip-filen

  # JOBB 2: Bygg för Android
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Android APK
        uses: fyne-io/action-fyne@v1
        with:
          os: 'android'
          app-id: 'com.prifre.vas2'
          icon: 'icon.png'

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vas-android
          path: '*.apk'