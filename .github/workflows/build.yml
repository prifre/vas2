name: Build macOS and Android Releases

on:
  push:
    branches: [ "master", "main" ]

jobs:
  # JOBB 1: macOS (Din gamla mall, uppdaterad för PATH)
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS App
        run: |
          $(go env GOPATH)/bin/fyne package -os darwin

      - name: Pack to Zip
        run: |
          zip -r vas_mac.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vas-macOS
          path: vas_mac.zip

  # JOBB 2: Android (Nytt jobb tillagt)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Android APK
        run: |
          $(go env GOPATH)/bin/fyne package -os android -appID com.prifre.vas2

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vas-android
          path: '*.apk'