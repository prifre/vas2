<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAS – Mätprogram för TSI-instrument</title>
    <style>
        :root {
            --primary: #0066cc;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --text: #333;
            --muted: #666;
            --border: #e1e8ed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 { margin: 0; color: var(--primary); font-size: 2.2rem; }
        header p { margin: 0.5rem 0 0; color: var(--muted); }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        h2 { color: var(--primary); margin-top: 0; font-size: 1.3rem; }

        ul { padding-left: 1.2rem; margin: 0.5rem 0; }
        li { margin-bottom: 0.3rem; }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .download-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.2rem;
            text-align: center;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .btn:hover { background: #004999; }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>VAS</h1>
        <p>Mät- och loggprogram för TSI-instrument</p>
    </header>

    <div class="container">
        
        <section class="card">
            <h2>Om VAS</h2>
            <p>VAS är ett program för realtidsmätning, datainsamling och analys av partiklar och luftkvalitet.</p>

        </section>

        <section class="card">
            <h2>Ladda ned VAS</h2>
            <div class="download-grid">
                
                <div class="download-card">
                    <h3>Windows</h3>
                    <p>64-bitars zip-arkiv</p>
                    <a href="vas2.0.3.zip" class="btn">Ladda ned vas2.0.3.zip</a>
                </div>

                <div class="download-card">
                    <h3>Linux</h3>
                    <p>64-bitars tar.gz-arkiv</p>
                    <a href="vas_2.0.3.tar.gz" class="btn">Ladda ned vas_2.0.3.tar.gz</a>
                </div>

            </div>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 Peter Freund</p>
    </footer>

</body>
</html>
